    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cigarette Master Fixed</title>
    <style>
        :root {
            --bg-color: #121212;
            --accent: #ff4500;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 40px 0;
            box-sizing: border-box;
            color: white;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .stats-container {
            width: 85%;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #ffcc00; }

        .stage {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .cigarette-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: scale(1.3);
            margin-bottom: 50px;
        }

        .filter {
            width: 30px; height: 60px;
            background: linear-gradient(to right, #e6a15c, #c07d39, #e6a15c);
            border-radius: 0 0 5px 5px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2);
            order: 3;
        }

        .tobacco {
            width: 28px; height: 300px;
            background: linear-gradient(to right, #ffffff, #f7f7f7, #ffffff);
            transform-origin: bottom;
            position: relative;
            order: 2;
            z-index: 1;
        }

        .cherry {
            width: 30px; height: 8px;
            background: #ff4500;
            box-shadow: 0 0 15px #ff4500, 0 0 5px #fff;
            border-radius: 4px 4px 0 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 360px; /* INITIAL_HEIGHT + FILTER_HEIGHT */
            z-index: 2;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            width: 80%;
            max-width: 300px;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #donutBtn { background: #444; color: white; display: block; }
        #resetBtn { background: var(--accent); color: white; display: none; }

        .smoke, .donut {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(4px);
        }
        .smoke { background: rgba(255, 255, 255, 0.2); }
        .donut { border: 6px solid rgba(255, 255, 255, 0.4); filter: blur(2px); }

        .burning .cherry {
            background: #ff8c00;
            box-shadow: 0 0 30px #ff4500, 0 0 10px #fff;
            transform: translateX(-50%) scaleY(1.3);
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-label">오늘</div>
            <div class="stat-value"><span id="todayCount">0</span>개</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">하루 평균</div>
            <div class="stat-value"><span id="avgCount">0</span>개</div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="cigarette-unit" id="cigUnit">
            <div class="cherry" id="cherry"></div>
            <div class="tobacco" id="tobacco"></div>
            <div class="filter" id="filter"></div>
        </div>
    </div>

    <div class="controls">
        <div id="statusHint" style="color: #666; font-size: 0.8rem;">화면을 꾹 누르면 더 빨리 탑니다</div>
        <button class="btn" id="donutBtn">🍩 도넛 만들기</button>
        <button class="btn" id="resetBtn">새 담배 꺼내기</button>
    </div>

    <script>
        const tobacco = document.getElementById('tobacco');
        const cherry = document.getElementById('cherry');
        const resetBtn = document.getElementById('resetBtn');
        const donutBtn = document.getElementById('donutBtn');
        const cigUnit = document.getElementById('cigUnit');
        const statusHint = document.getElementById('statusHint');

        const INITIAL_HEIGHT = 300;
        const FILTER_HEIGHT = 60;
        let currentHeight = INITIAL_HEIGHT;
        let isBurningFast = false;
        let animationId = null;

        // 속도 설정 (0.03은 꽤 느리니 테스트를 위해 약간 올렸습니다)
        const NORMAL_SPEED = 0.05; 
        const FAST_SPEED = 0.6;

        function updateStats() {
            try {
                const data = JSON.parse(localStorage.getItem('smokeStatsVFinal')) || { total: 0, start: new Date().toISOString(), history: {} };
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('todayCount').innerText = data.history[today] || 0;
                const days = Math.max(1, Math.ceil((new Date() - new Date(data.start)) / (1000*60*60*24)));
                document.getElementById('avgCount').innerText = (data.total / days).toFixed(1);
                return data;
            } catch(e) { return { total: 0, history: {} }; }
        }

        function addRecord() {
            const data = updateStats();
            const today = new Date().toISOString().split('T')[0];
            data.total += 1;
            data.history[today] = (data.history[today] || 0) + 1;
            localStorage.setItem('smokeStatsVFinal', JSON.stringify(data));
            updateStats();
        }

        function animate() {
            if (currentHeight > 0) {
                const speed = isBurningFast ? FAST_SPEED : NORMAL_SPEED;
                currentHeight -= speed;
                
                tobacco.style.height = Math.max(0, currentHeight) + 'px';
                cherry.style.bottom = (Math.max(0, currentHeight) + FILTER_HEIGHT - 4) + 'px';
                
                if (Math.random() > 0.92) createSmoke(false);
                animationId = requestAnimationFrame(animate);
            } else {
                finish();
            }
        }

        function finish() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;

            tobacco.style.height = '0px';
            cherry.style.bottom = FILTER_HEIGHT + 'px';
            cherry.style.visibility = 'hidden';
            
            resetBtn.style.display = 'block';
            donutBtn.style.display = 'none';
            statusHint.innerText = "한 개비를 다 피웠습니다.";
            
            addRecord();
        }

        function reset() {
            // 1. 기존 애니메이션 완전 중지
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;

            // 2. 변수 및 UI 초기화
            currentHeight = INITIAL_HEIGHT;
            tobacco.style.height = INITIAL_HEIGHT + 'px';
            cherry.style.bottom = (INITIAL_HEIGHT + FILTER_HEIGHT - 4) + 'px';
            cherry.style.visibility = 'visible';
            
            // 3. 버튼 상태 교체
            resetBtn.style.display = 'none';
            donutBtn.style.display = 'block';
            statusHint.innerText = "화면을 꾹 누르면 더 빨리 탑니다";
            
            // 4. 애니메이션 다시 시작
            animate();
        }

        function createSmoke(isDonut) {
            const el = document.createElement('div');
            el.className = isDonut ? 'donut' : 'smoke';
            const rect = cherry.getBoundingClientRect();
            const size = isDonut ? 40 : Math.random() * 20 + 10;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (rect.left + rect.width / 2 - size / 2) + 'px'; 
            el.style.top = (rect.top) + 'px';
            document.body.appendChild(el);

            const xMove = isDonut ? (Math.random() > 0.5 ? 120 : -120) : (Math.random() - 0.5) * 80;
            const yMove = isDonut ? -60 : -200;

            el.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 0.5 },
                { transform: `translate(${xMove}px, ${yMove}px) scale(${isDonut ? 2 : 4})`, opacity: 0 }
            ], { duration: isDonut ? 2500 : 3000, easing: 'ease-out' })
            .onfinish = () => el.remove();
        }

        // 이벤트 리스너
        const startBurn = (e) => { 
            if(e.target.tagName === 'BUTTON') return;
            isBurningFast = true; 
            cigUnit.classList.add('burning'); 
        };
        const endBurn = () => { isBurningFast = false; cigUnit.classList.remove('burning'); };

        window.addEventListener('mousedown', startBurn);
        window.addEventListener('mouseup', endBurn);
        window.addEventListener('touchstart', startBurn);
        window.addEventListener('touchend', endBurn);

        donutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            createSmoke(true);
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            reset();
        });

        // 초기 실행
        updateStats();
        animate();
    </script>
</body>
</html>
