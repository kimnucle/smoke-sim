<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cigarette Vertical Fixed</title>
    <style>
        :root {
            --bg-color: #121212;
            --accent: #ff4500;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 40px 0;
            box-sizing: border-box;
            color: white;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 통계 영역 */
        .stats-container {
            width: 85%;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #ffcc00; }

        /* --- 세로형 담배 메인 스테이지 --- */
        .stage {
            flex: 1;
            display: flex;
            align-items: flex-end; /* 담배를 무대 바닥에 정렬 */
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .cigarette-unit {
            display: flex;
            flex-direction: column; /* 세로 정렬 */
            align-items: center;
            position: relative; /* 자식 absolute 배치의 기준 */
            transform: scale(1.3); /* 모바일 확대 */
            margin-bottom: 50px; /* 바닥에서 약간 띄움 */
        }

        .filter {
            width: 30px; 
            height: 60px; /* 세로 */
            background: linear-gradient(to right, #e6a15c, #c07d39, #e6a15c);
            border-radius: 0 0 5px 5px; /* 아래쪽 둥글게 */
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2);
            order: 3; /* 아래 */
            margin-top: -1px; /* 바디와 겹침 방지 */
        }

        .tobacco {
            width: 28px; 
            height: 300px; /* 초기 길이 */
            background: linear-gradient(to right, #ffffff, #f7f7f7, #ffffff);
            transform-origin: bottom; /* 아래 기준 짧아짐 */
            position: relative;
            order: 2; /* 가운데 */
            z-index: 1; /* 불꽃보다 아래 */
        }

        /* --- 🔥 수정된 불꽃 CSS (위치 고정) --- */
        .cherry {
            width: 30px; 
            height: 8px; /* 가로형 불꽃 */
            background: #ff4500;
            box-shadow: 0 0 15px #ff4500, 0 0 5px #fff;
            border-radius: 4px 4px 0 0; /* 위쪽 둥글게 */
            
            position: absolute; /* .cigarette-unit 기준 절대 좌표 */
            left: 50%;
            transform: translateX(-50%); /* 가로 중앙 완벽 고정 */
            
            /* 초기 위치: tobacco 맨 위에 배치 (tobacco height + filter height) */
            bottom: calc(300px + 60px); 
            z-index: 2; /* tobacco 위에 배치 */
            
            order: 1; /* absolute라 배치 의미 없음 */
        }

        /* 버튼 영역 */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            width: 80%;
            max-width: 300px;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #donutBtn { background: #444; color: white; }
        #donutBtn:active { background: #666; transform: scale(0.95); }

        #resetBtn { background: var(--accent); color: white; display: none; }

        /* 연기 & 도넛 애니메이션 (세로 최적화) */
        .smoke, .donut {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(4px);
        }

        .smoke { background: rgba(255, 255, 255, 0.2); }
        
        .donut {
            border: 6px solid rgba(255, 255, 255, 0.4);
            filter: blur(2px);
        }

        .burning .cherry {
            background: #ff8c00;
            box-shadow: 0 0 30px #ff4500, 0 0 10px #fff;
            transform: translateX(-50%) scaleY(1.3); /* 중앙 유지하며 세로 확대 */
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-label">오늘</div>
            <div class="stat-value"><span id="todayCount">0</span>개</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">하루 평균</div>
            <div class="stat-value"><span id="avgCount">0</span>개</div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="cigarette-unit" id="cigUnit">
            <div class="cherry" id="cherry"></div>
            <div class="tobacco" id="tobacco"></div>
            <div class="filter" id="filter"></div>
        </div>
    </div>

    <div class="controls">
        <div style="color: #666; font-size: 0.8rem;">화면 아무 곳이나 꾹 누르면 더 빨리 탑니다</div>
        <button class="btn" id="donutBtn">🍩 도넛 만들기</button>
        <button class="btn" id="resetBtn">새 담배 꺼내기</button>
    </div>

    <script>
        const tobacco = document.getElementById('tobacco');
        const cherry = document.getElementById('cherry');
        const resetBtn = document.getElementById('resetBtn');
        const donutBtn = document.getElementById('donutBtn');
        const cigUnit = document.getElementById('cigUnit');

        const INITIAL_HEIGHT = 300; // 초기 길이
        const FILTER_HEIGHT = 60;   // 필터 높이 (CSS와 동일)
        let currentHeight = INITIAL_HEIGHT;
        let isBurningFast = false;
        let animationId;

        const NORMAL_SPEED = 0.03;
        const FAST_SPEED = 0.4;

        function updateStats() {
            const data = JSON.parse(localStorage.getItem('smokeStatsV3')) || { total: 0, start: new Date().toISOString(), history: {} };
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('todayCount').innerText = data.history[today] || 0;
            const days = Math.max(1, Math.ceil((new Date() - new Date(data.start)) / (1000*60*60*24)));
            document.getElementById('avgCount').innerText = (data.total / days).toFixed(1);
            return data;
        }

        function addRecord() {
            const data = updateStats();
            const today = new Date().toISOString().split('T')[0];
            data.total += 1;
            data.history[today] = (data.history[today] || 0) + 1;
            localStorage.setItem('smokeStatsV3', JSON.stringify(data));
            updateStats();
        }

        // --- 🔥 수정된 애니메이션 로직 (불꽃 위치 추적) ---
        function animate() {
            if (currentHeight > 0) {
                const speed = isBurningFast ? FAST_SPEED : NORMAL_SPEED;
                currentHeight -= speed;
                
                // 1. tobacco 높이 조절
                tobacco.style.height = currentHeight + 'px';
                
                // 2. cherry 위치 조절 (tobacco 위에 고정)
                // bottom: (현재 담배 높이 + 필터 높이 - 불꽃 중앙 오프셋)
                // 불꽃 높이(8px)의 절반만큼 tobacco와 겹치게(4px) 설정
                const offset = 4;
                cherry.style.bottom = (currentHeight + FILTER_HEIGHT - offset) + 'px';
                
                if (Math.random() > 0.90) createSmoke(false);
                animationId = requestAnimationFrame(animate);
            } else {
                finish();
            }
        }

        function finish() {
            cancelAnimationFrame(animationId);
            tobacco.style.height = '0px';
            // 다 탔을 때 불꽃은 필터 바로 위에 고정
            cherry.style.bottom = FILTER_HEIGHT + 'px';
            cherry.style.visibility = 'hidden';
            resetBtn.style.display = 'block';
            donutBtn.style.display = 'none';
            addRecord();
        }

        function reset() {
            currentHeight = INITIAL_HEIGHT;
            tobacco.style.height = INITIAL_HEIGHT + 'px';
            cherry.style.visibility = 'visible';
            resetBtn.style.display = 'none';
            donutBtn.style.display = 'block';
            animate();
        }

        // --- 연기 & 도넛 생성 (중앙 중앙 정렬 수정) ---
        function createSmoke(isDonut) {
            const el = document.createElement('div');
            el.className = isDonut ? 'donut' : 'smoke';
            
            const rect = cherry.getBoundingClientRect();
            const size = isDonut ? 30 : Math.random() * 20 + 10;
            
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            // 불꽃 가로 중앙에 연기/도넛 배치
            el.style.left = (rect.left + rect.width / 2 - size / 2) + 'px'; 
            el.style.top = (rect.top + rect.height / 2 - size / 2) + 'px'; // 불꽃 세로 중앙 오프셋 추가
            
            document.body.appendChild(el);

            const xMove = isDonut ? (Math.random() > 0.5 ? 150 : -150) : (Math.random() - 0.5) * 60;
            const yMove = isDonut ? -30 : -150;

            el.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 0.5 },
                { transform: `translate(${xMove}px, ${yMove}px) scale(${isDonut ? 2.5 : 3})`, opacity: 0 }
            ], {
                duration: isDonut ? 3000 : 2500,
                easing: 'ease-out'
            }).onfinish = () => el.remove();
        }

        // --- 이벤트 바인딩 ---
        const startBurn = () => { isBurningFast = true; cigUnit.classList.add('burning'); };
        const endBurn = () => { isBurningFast = false; cigUnit.classList.remove('burning'); };

        window.addEventListener('mousedown', startBurn);
        window.addEventListener('mouseup', endBurn);
        window.addEventListener('touchstart', (e) => { 
            if(e.target.tagName !== 'BUTTON') startBurn(); 
        });
        window.addEventListener('touchend', endBurn);

        donutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            createSmoke(true);
        });

        resetBtn.addEventListener('click', (e) => {smo
            e.stopPropagation();
            reset();
        });

        // 초기화
        updateStats();
        animate();
    </script>
</body>
</html>
